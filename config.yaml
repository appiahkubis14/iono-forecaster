# IonoForecaster — ESA-Grade Ionospheric Scintillation Forecasting
# Copernicus Master's in Digital Earth | Samuel Appiah Kubi
# Paris Lodron University Salzburg

project:
  name: "IonoForecaster"
  version: "1.0.0"
  author: "Samuel Appiah Kubi"
  institution: "Paris Lodron University Salzburg"
  license: "MIT"

study_region:
  name: "Equatorial Africa"
  bounds:
    min_lon: -30
    max_lon: 60
    min_lat: -20
    max_lat: 20

temporal:
  start_date: "2018-01-01"
  end_date: "2024-12-31"
  train_start: "2018-01-01"
  train_end: "2020-12-31"
  val_start: "2021-01-01"
  val_end: "2022-12-31"
  test_start: "2023-01-01"
  test_end: "2024-12-31"
  resolution_minutes: 30
  forecast_hours: 6

